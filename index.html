<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gable Homes — BTZL workflow</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a1a;
    --ink-light: #666;
    --ink-faint: #999;
    --border: #e0e0e0;
    --bg: #fafafa;
    --white: #ffffff;
    --weekly: #1a3a5c;
    --monthly: #2d6a4f;
    --radius: 4px;
    --must-bg: #fff8f0;
    --must-border: #f0c080;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
  }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  header span { font-size: 13px; color: var(--ink-light); }

  nav {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
  }
  nav button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 12px 20px;
    font-size: 14px;
    color: var(--ink-light);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  nav button:hover { color: var(--ink); }
  nav button.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }

  main { padding: 32px; max-width: 1140px; margin: 0 auto; }

  .view { display: none; }
  .view.active { display: block; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  /* ── Explore: cycle tracks ── */
  .cycle-track { margin-bottom: 28px; }
  .cycle-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .cycle-badge {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 10px; border-radius: 20px; color: var(--white);
  }
  .cycle-badge.weekly { background: var(--weekly); }
  .cycle-badge.monthly { background: var(--monthly); }

  .stage-nodes { display: flex; flex-wrap: wrap; gap: 8px; }

  .bookend-node {
    padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--white); font-size: 13px; color: var(--ink-faint); font-style: italic;
    display: flex; align-items: center;
  }

  .stage-node {
    padding: 10px 18px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--white); font-size: 13px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    user-select: none; display: flex; align-items: center; gap: 8px;
  }
  .stage-node:hover { border-color: #aaa; }
  .stage-node.active-weekly { background: var(--weekly); border-color: var(--weekly); color: var(--white); }
  .stage-node.active-monthly { background: var(--monthly); border-color: var(--monthly); color: var(--white); }
  .stage-node .count { font-size: 11px; opacity: 0.65; }

  /* ── Stage detail panel ── */
  .stage-detail {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; margin-top: 8px; animation: fadeIn 0.15s ease;
  }
  .stage-detail h3 {
    font-size: 15px; font-weight: 600; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .stage-tag {
    font-size: 11px; font-weight: 500; padding: 2px 8px;
    border-radius: 20px; color: var(--white);
  }
  .stage-tag.weekly { background: var(--weekly); }
  .stage-tag.monthly { background: var(--monthly); }

  /* ── People ── */
  .people-section { margin-top: 32px; }
  .people-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .person-chip {
    padding: 7px 16px; border: 1px solid var(--border); border-radius: 100px;
    background: var(--white); font-size: 13px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s; user-select: none;
  }
  .person-chip:hover { border-color: #aaa; }
  .person-chip.active { background: var(--ink); border-color: var(--ink); color: var(--white); }

  .person-detail {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; margin-top: 12px; animation: fadeIn 0.15s ease;
  }
  .person-detail h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .person-role { font-size: 13px; color: var(--ink-light); margin-bottom: 20px; }
  .person-detail h4 {
    font-size: 12px; font-weight: 600; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px;
  }

  /* ── Activity list ── */
  .activity-list { list-style: none; }
  .activity-item { border-bottom: 1px solid var(--border); cursor: pointer; }
  .activity-item:last-child { border-bottom: none; }
  .activity-item-row {
    display: flex; align-items: baseline; gap: 12px; padding: 10px 0;
    transition: background 0.1s;
  }
  .activity-item-row:hover {
    background: #f5f5f5; margin: 0 -12px; padding: 10px 12px; border-radius: var(--radius);
  }
  .activity-id { font-size: 11px; color: var(--ink-faint); min-width: 42px; font-variant-numeric: tabular-nums; }
  .activity-title { flex: 1; font-size: 13px; }
  .activity-who { font-size: 12px; color: var(--ink-light); white-space: nowrap; }

  /* ── Detail card ── */
  .detail-card {
    background: #f8f8f8; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-top: 4px; animation: fadeIn 0.12s ease;
  }
  .detail-card-header { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
  .detail-fields { display: flex; flex-direction: column; gap: 10px; }
  .detail-field { display: flex; gap: 12px; align-items: flex-start; }
  .detail-field-label {
    font-size: 11px; font-weight: 600; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em; min-width: 72px; padding-top: 1px;
  }
  .detail-field-value {
    font-size: 13px; color: var(--ink); flex: 1;
    border-radius: 3px; padding: 1px 4px; margin: -1px -4px; transition: background 0.1s;
  }
  .detail-field-value:hover { background: #ebebeb; }
  .detail-field-value[contenteditable="true"] { background: var(--white); outline: 1px solid #aaa; }
  .must-field .detail-field-value {
    background: var(--must-bg); border: 1px solid var(--must-border);
    border-radius: var(--radius); padding: 4px 8px; margin: 0;
  }
  .must-field .detail-field-value:hover { background: #fff4e0; }
  .receives-field .detail-field-value { color: var(--ink-light); font-size: 12px; }
  .edit-note { margin-top: 12px; font-size: 11px; color: var(--ink-faint); font-style: italic; }

  /* ── Full list ── */
  .phase-group { margin-bottom: 36px; }
  .phase-group-label {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--white); padding: 4px 10px; border-radius: var(--radius);
    display: inline-block; margin-bottom: 12px;
  }
  .phase-group-label.weekly { background: var(--weekly); }
  .phase-group-label.monthly { background: var(--monthly); }

  /* ── Flow ── */
  .flow-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .flow-stage-btn {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--white); font-size: 13px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .flow-stage-btn:hover { border-color: #aaa; }
  .flow-stage-btn.active-weekly { background: var(--weekly); border-color: var(--weekly); color: var(--white); }
  .flow-stage-btn.active-monthly { background: var(--monthly); border-color: var(--monthly); color: var(--white); }

  /* Swimlane */
  .swimlane-outer { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
  .swimlane-header {
    padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
    font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px;
    position: sticky; left: 0;
  }
  .cycle-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cycle-dot.weekly { background: var(--weekly); }
  .cycle-dot.monthly { background: var(--monthly); }

  .swimlane-inner { position: relative; min-width: max-content; }

  .swimlane-grid { display: grid; grid-template-columns: 130px 1fr; }

  .swimlane-role-cell {
    font-size: 12px; font-weight: 600; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 14px 16px; background: #f8f8f8;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    white-space: nowrap; display: flex; align-items: center;
    position: sticky; left: 0; z-index: 2;
  }
  .swimlane-activities-cell {
    display: flex; align-items: center; padding: 14px 16px;
    border-bottom: 1px solid var(--border); gap: 0;
    min-height: 72px;
  }
  .swimlane-role-cell:last-of-type,
  .swimlane-activities-cell:last-of-type { border-bottom: none; }

  .flow-box {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 12px; font-size: 12px; background: var(--white);
    width: 160px; flex-shrink: 0; cursor: pointer;
    transition: border-color 0.1s, box-shadow 0.1s;
    position: relative;
  }
  .flow-box:hover { border-color: #999; }
  .flow-box.highlighted { border-color: #1a3a5c; box-shadow: 0 0 0 2px rgba(26,58,92,0.15); }
  .flow-box .flow-id { font-size: 10px; color: var(--ink-faint); margin-bottom: 3px; }
  .flow-box .flow-label { font-size: 11px; line-height: 1.4; }

  /* Spacer between boxes in the same row */
  .flow-box + .flow-box { margin-left: 48px; }

  /* SVG arrows overlay */
  .arrows-svg {
    position: absolute; top: 0; left: 0;
    pointer-events: none; overflow: visible;
  }

  .flow-detail-card {
    background: #f8f8f8; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-top: 16px; animation: fadeIn 0.12s ease;
  }

  .swimlane-hint {
    font-size: 12px; color: var(--ink-faint); padding: 10px 20px;
    border-top: 1px solid var(--border); position: sticky; left: 0;
  }

  /* ── Portfolio ── */
  .portfolio-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .project-row {
    display: grid; grid-template-columns: 1fr 160px 140px 60px 140px 120px;
    gap: 0; align-items: center;
    background: var(--white); cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid var(--border);
  }
  .project-row:last-child { border-bottom: none; }
  .project-row:hover { background: #f5f5f5; }
  .project-row.active { background: #f0f4f8; }
  .project-row > div { padding: 14px 16px; font-size: 13px; }
  .project-row-hdr > div {
    padding: 8px 16px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint);
    background: #f8f8f8;
  }
  .project-name { font-weight: 600; }
  .project-status {
    display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px;
    border-radius: 20px; white-space: nowrap;
  }
  .status-under   { background: #e6f4ea; color: #2d6a4f; }
  .status-pre     { background: #fff8e6; color: #8a6000; }
  .status-entitle { background: #f0f0f0; color: #555; }
  .project-estimate { font-variant-numeric: tabular-nums; color: var(--ink-light); }

  .portfolio-detail {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    margin-top: 16px; animation: fadeIn 0.15s ease; overflow: hidden;
  }
  .portfolio-detail-header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .portfolio-detail-header h2 { font-size: 17px; font-weight: 600; }
  .portfolio-detail-header .phdr-meta { font-size: 13px; color: var(--ink-light); }

  .portfolio-section { padding: 0 24px 24px; }
  .portfolio-section + .portfolio-section { border-top: 1px solid var(--border); padding-top: 20px; }
  .portfolio-section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-faint); margin: 20px 0 14px;
  }

  /* SOV table */
  .sov-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sov-table th {
    text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0 12px 8px; border-bottom: 1px solid var(--border);
  }
  .sov-table th:first-child { padding-left: 0; }
  .sov-table td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
  .sov-table td:first-child { padding-left: 0; }
  .sov-table tr:last-child td { border-bottom: none; }
  .sov-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .sov-total td { font-weight: 600; border-top: 1px solid var(--border); border-bottom: none; padding-top: 12px; }

  .confidence-tag {
    display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 7px;
    border-radius: 20px; cursor: pointer; transition: opacity 0.1s; white-space: nowrap;
  }
  .confidence-tag:hover { opacity: 0.75; }
  .conf-confirmed  { background: #e6f4ea; color: #2d6a4f; }
  .conf-pending    { background: #fff8e6; color: #8a6000; }
  .conf-flagged    { background: #fdecea; color: #b71c1c; }
  .conf-missing    { background: #f0f0f0; color: #555; }
  .conf-estimate   { background: #e8f0fe; color: #1a56a0; }
  .conf-budget     { background: #f3e8ff; color: #6b21a8; }

  .confidence-popover {
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-top: 8px; font-size: 13px;
    animation: fadeIn 0.12s ease; display: flex; flex-direction: column; gap: 6px;
  }
  .confidence-popover strong { font-size: 12px; font-weight: 600; }
  .confidence-popover .conf-when {
    font-size: 11px; color: var(--ink-faint); font-style: italic;
  }

  /* Portfolio summary tables (Debt by lender, Equity by investor) */
  .summary-grid { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--white); margin-top: 12px; }
  .summary-grid-row { display: grid; border-bottom: 1px solid #f0f0f0; }
  .summary-grid-row:last-child { border-bottom: none; }
  .summary-grid-row > div { padding: 13px 16px; font-size: 13px; color: var(--ink); }
  .summary-grid-hdr > div { padding: 9px 16px; font-size: 11px; font-weight: 400; color: var(--ink-faint); text-transform: none; letter-spacing: 0; border-bottom: 1px solid var(--border); background: var(--white); }
  .summary-grid-row .sg-num { text-align: right; font-variant-numeric: tabular-nums; }
  .summary-grid-row .sg-group { font-weight: 600; }

  /* Debt / Investor rows */
  .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .profile-card {
    background: #f8f8f8; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px;
  }
  .profile-card-name { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
  .profile-field { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 12px; border-bottom: 1px solid #ebebeb; }
  .profile-field:last-child { border-bottom: none; }
  .profile-field-label { color: var(--ink-faint); }
  .profile-field-value { font-variant-numeric: tabular-nums; text-align: right; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  @media (max-width: 640px) {
    main { padding: 20px 16px; }
    header { padding: 16px; }
    nav { padding: 0 16px; }
    nav button { padding: 10px 12px; font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <h1>Gable Homes — BTZL workflow</h1>
  <span id="header-count"></span>
</header>

<nav>
  <button class="active" data-tab="explore">Explore</button>
  <button data-tab="fulllist">Full list</button>
  <button data-tab="flow">Flow</button>
  <button data-tab="portfolio">Portfolio</button>
</nav>

<main>
  <div id="view-explore" class="view active">
    <div id="explore-tracks"></div>
    <div id="stage-detail-panel"></div>
    <div class="people-section">
      <div class="section-label">People</div>
      <div class="people-row" id="people-row"></div>
    </div>
    <div id="person-detail-panel"></div>
  </div>

  <div id="view-fulllist" class="view">
    <div id="fulllist-content"></div>
  </div>

  <div id="view-flow" class="view">
    <div class="section-label" style="margin-bottom:16px">Select a stage</div>
    <div class="flow-controls" id="flow-controls"></div>
    <div id="flow-panel"></div>
  </div>

  <div id="view-portfolio" class="view">
    <div id="portfolio-content"></div>
  </div>
</main>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const STAGES = [
  { cycle: 'Weekly',  name: 'Intake' },
  { cycle: 'Weekly',  name: 'Processing' },
  { cycle: 'Weekly',  name: 'Weekly view' },
  { cycle: 'Monthly', name: 'Financial Analysis Package Assembly' },
  { cycle: 'Monthly', name: 'Reporting and Analysis' },
];

const PEOPLE_META = {
  Fernando:  { role: 'Owner and sponsor', note: 'Minimal touchpoints by design. Signs off, responds to escalations, aligns on monthly outlook.' },
  Brian:     { role: 'Field construction lead', note: 'Confirms field documentation and weekly percent complete. Front line for subcontractors and materials on site.' },
  Javier:    { role: 'Field coordinator and estimating', note: 'Handles purchases and online orders. Sends delivery confirmations and change order notices.' },
  Andreina:  { role: 'Administrative', note: 'Labor payment documents and bank movements only. Not responsible for chasing.' },
  Alexandra: { role: 'Finishes and FF&E', note: 'Online order and delivery confirmations for finishes and FF&E.' },
  Claudia:   { role: 'Internal coordination', note: 'Consolidation and confirmation routing. First filter before BTZL.' },
  Laura:     { role: 'BTZL', note: 'Classification, confidence levels, SOV updates, draw package assembly, monthly reporting.' },
  Alejandro: { role: 'BTZL CFO', note: 'Change order escalation, weekly cash flow snapshot, monthly portfolio review and analysis.' },
};
const CANONICAL_ORDER = ['Fernando', 'Brian', 'Javier', 'Andreina', 'Alexandra', 'Claudia', 'Laura', 'Alejandro'];

// ── State ─────────────────────────────────────────────────────────────────
let DATA = [];
let activeStage = null;
let activePerson = null;
let activeFlowStage = null;

// ── Bootstrap ─────────────────────────────────────────────────────────────
fetch('workflow.json')
  .then(r => r.json())
  .then(data => {
    DATA = data;
    document.getElementById('header-count').textContent = `${DATA.length} activities across 5 stages`;
    buildExplore();
    buildFullList();
    buildFlowControls();
  });

// ── Tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Helpers ───────────────────────────────────────────────────────────────
function whoList(act) {
  return act['Who does it'].split(',').map(s => s.trim());
}

function parseRefIds(receivesFrom) {
  return (receivesFrom.match(/\d+\.\d+\.\d+/g) || []);
}

function cycleClass(cycle) { return cycle.toLowerCase().replace(/\s+/g, '-'); }

function buildDetailCard(act) {
  const div = document.createElement('div');
  div.className = 'detail-card';
  div.innerHTML = `
    <div class="detail-card-header">${act.ID} — ${act.Activity}</div>
    <div class="detail-fields">
      <div class="detail-field">
        <span class="detail-field-label">Who</span>
        <span class="detail-field-value" data-editable title="Click to edit (illustrative)">${act['Who does it']}</span>
      </div>
      <div class="detail-field">
        <span class="detail-field-label">Frequency</span>
        <span class="detail-field-value" data-editable title="Click to edit (illustrative)">${act.Frequency}</span>
      </div>
      <div class="detail-field">
        <span class="detail-field-label">Channel</span>
        <span class="detail-field-value" data-editable title="Click to edit (illustrative)">${act.Channel}</span>
      </div>
      <div class="detail-field must-field">
        <span class="detail-field-label">Must</span>
        <span class="detail-field-value" data-editable title="Click to edit (illustrative)">${act.Must}</span>
      </div>
      <div class="detail-field receives-field">
        <span class="detail-field-label">From</span>
        <span class="detail-field-value">${act['Receives from']}</span>
      </div>
    </div>
    <p class="edit-note">Fields are editable here as a demonstration — changes are not saved.</p>
  `;
  div.querySelectorAll('[data-editable]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); el.contentEditable = 'true'; el.focus(); });
    el.addEventListener('blur', () => { el.contentEditable = 'false'; });
  });
  return div;
}

function toggleInlineActivity(id, act, li) {
  const existing = li.querySelector('.detail-card');
  if (existing) { existing.remove(); return; }
  document.querySelectorAll('.detail-card').forEach(c => c.remove());
  li.appendChild(buildDetailCard(act));
}

function activityLi(act, contextLabel) {
  const li = document.createElement('li');
  li.className = 'activity-item';
  const row = document.createElement('div');
  row.className = 'activity-item-row';
  row.innerHTML = `
    <span class="activity-id">${act.ID}</span>

  `;

  row.addEventListener('click', () => toggleInlineActivity(act.ID, act, li));

}

function buildExplore() {

    track.appendChild(header);

    if (cycle === 'Weekly') {
      const be = document.createElement('div');
      be.className = 'bookend-node';
      be.textContent = 'Phase zero handoff';
      nodes.appendChild(be);
    }

    STAGES.filter(s => s.cycle === cycle).forEach(({ name }) => {

function toggleStage(cycle, name, btn) {
  // Clear person selection
  activePerson = null;
  document.querySelectorAll('.person-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('person-detail-panel').innerHTML = '';

  const same = activeStage && activeStage.name === name;
  document.querySelectorAll('.stage-node').forEach(n => n.classList.remove('active-weekly', 'active-monthly'));
  document.querySelectorAll('.detail-card').forEach(c => c.remove());

  if (same) {
    activeStage = null;
    document.getElementById('stage-detail-panel').innerHTML = '';
    return;
  }

  activeStage = { cycle, name };
  btn.classList.add(`active-${cycleClass(cycle)}`);
  renderStageDetail(cycle, name);
}

function renderStageDetail(cycle, name) {
  const panel = document.getElementById('stage-detail-panel');
  const activities = DATA.filter(r => r.Stage === name).sort((a, b) => a.Sequence - b.Sequence);
  const cc = cycleClass(cycle);

  panel.innerHTML = `

// Return the first role in CANONICAL_ORDER (or provided subset) that this activity belongs to
function primaryRole(act, roles) {
  const who = whoList(act);
  return (roles || CANONICAL_ORDER).find(r => who.includes(r)) || who[0];
}

// ── Flow: router ──────────────────────────────────────────────────────────
function renderFlow(cycle, stageName) {
  const panel = document.getElementById('flow-panel');
  panel.innerHTML = '';
  const activities = DATA.filter(r => r.Stage === stageName).sort((a, b) => a.Sequence - b.Sequence);
  const stageIds = new Set(activities.map(a => a.ID));
  if (stageName === 'Intake') {
    panel.appendChild(renderFlowIntake(cycle, stageName, activities, stageIds));
  } else {
    panel.appendChild(renderFlowPOC(cycle, stageName, activities, stageIds));
  }
}

// ── Flow: standard layout (diagonal bezier arrows, flex rows) ─────────────
function renderFlowStandard(cycle, stageName, activities, stageIds) {
  const rolesSet = new Set();
  activities.forEach(act => whoList(act).forEach(r => rolesSet.add(r)));
  const roles = CANONICAL_ORDER.filter(r => rolesSet.has(r));
  const cc = cycleClass(cycle);

  const outer = document.createElement('div');
  outer.className = 'swimlane-outer';

  const hdr = document.createElement('div');
  hdr.className = 'swimlane-header';
  hdr.innerHTML = `<span class="cycle-dot ${cc}"></span>${stageName}`;
  outer.appendChild(hdr);

  const inner = document.createElement('div');
  inner.className = 'swimlane-inner';
  inner.id = 'flow-swimlane-inner';

  const grid = document.createElement('div');
  grid.className = 'swimlane-grid';

  const boxMap = {};

  roles.forEach(role => {
    const roleActs = activities.filter(a => whoList(a).includes(role));

    const roleCell = document.createElement('div');
    roleCell.className = 'swimlane-role-cell';
    roleCell.textContent = role;

    const actsCell = document.createElement('div');
    actsCell.className = 'swimlane-activities-cell';

    roleActs.forEach(act => {
      const box = document.createElement('div');
      box.className = 'flow-box';
      box.dataset.actId = act.ID;
      box.innerHTML = `<div class="flow-id">${act.ID}</div><div class="flow-label">${act.Activity}</div>`;
      box.addEventListener('click', e => {
        e.stopPropagation();
        const existing = document.querySelector('.flow-detail-card');
        if (existing) {
          if (existing.previousSibling === box) { existing.remove(); return; }
          existing.remove();
        }
        const card = buildDetailCard(act);
        card.classList.add('flow-detail-card');
        box.after(card);
        document.querySelectorAll('.flow-box').forEach(b => b.classList.remove('highlighted'));
        parseRefIds(act['Receives from']).forEach(refId => {
          const srcBox = grid.querySelector(`[data-act-id="${refId}"]`);
          if (srcBox) srcBox.classList.add('highlighted');
        });
      });
      actsCell.appendChild(box);
      boxMap[act.ID] = box;
    });

    grid.appendChild(roleCell);
    grid.appendChild(actsCell);
  });

  inner.appendChild(grid);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.classList.add('arrows-svg');
  svg.innerHTML = `<defs><marker id="ah" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#bbb"/></marker></defs>`;
  inner.appendChild(svg);
  outer.appendChild(inner);

  const hint = document.createElement('div');
  hint.className = 'swimlane-hint';
  hint.textContent = 'Arrows show handoffs defined in Receives from. Click any activity for details.';
  outer.appendChild(hint);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const cr = inner.getBoundingClientRect();
    function relRect(el) {
      const r = el.getBoundingClientRect();
      return { left: r.left - cr.left + inner.scrollLeft, top: r.top - cr.top + inner.scrollTop,
               right: r.right - cr.left + inner.scrollLeft, bottom: r.bottom - cr.top + inner.scrollTop,
               width: r.width, height: r.height };
    }
    svg.setAttribute('width', inner.scrollWidth);
    svg.setAttribute('height', inner.scrollHeight);
    activities.forEach(act => {
      const srcIds = parseRefIds(act['Receives from']).filter(id => stageIds.has(id));
      if (!srcIds.length) return;
      const targetBox = boxMap[act.ID];
      if (!targetBox) return;
      const tr = relRect(targetBox);
      srcIds.forEach(srcId => {
        const srcBox = boxMap[srcId];
        if (!srcBox) return;
        const sr = relRect(srcBox);
        const x1 = sr.right, y1 = sr.top + sr.height / 2;
        const x2 = tr.left,  y2 = tr.top + tr.height / 2;
        const sameRow = Math.abs(y1 - y2) < 10;
        let d;
        if (sameRow) {
          const mx = (x1 + x2) / 2;
          d = `M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
        } else {
          const cp = Math.max(Math.abs(x2 - x1) * 0.5, 60);
          d = `M ${x1} ${y1} C ${x1+cp} ${y1} ${x2-cp} ${y2} ${x2} ${y2}`;
        }
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('stroke', '#bbb');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#ah)');
        svg.appendChild(path);
      });
    });
  }));

  return outer;
}

// ── Flow: POC layout — fixed column positions + right-angle connectors ────
// Column x = sequence number within stage, row y = primary role.
// Connectors: H → V → H (no diagonals). Used for all stages except Intake.
function renderFlowPOC(cycle, stageName, activities, stageIds) {
  const ROW_H = 150, COL_W = 220, BOX_W = 155, PAD_X = 20, LANE_PAD = 14;

  const rolesSet = new Set();
  activities.forEach(act => whoList(act).forEach(r => rolesSet.add(r)));
  const roles = CANONICAL_ORDER.filter(r => rolesSet.has(r));
  const rIdx = Object.fromEntries(roles.map((r, i) => [r, i]));

  const maxSeq = Math.max(...activities.map(a => a.Sequence));
  const canvasW = PAD_X + (maxSeq - 1) * COL_W + BOX_W + PAD_X;
  const canvasH = roles.length * ROW_H;
  const cc = cycleClass(cycle);

  const actMap = Object.fromEntries(activities.map(a => [a.ID, a]));

  // Position helpers (all computed, no DOM measurement needed)
  const bx  = seq => PAD_X + (seq - 1) * COL_W;    // box left edge
  const by  = ri  => ri * ROW_H + LANE_PAD;         // box top (top-padded, auto height)
  const ex  = seq => bx(seq) + BOX_W;               // connector exit x (source right edge)
  const cy  = ri  => ri * ROW_H + ROW_H / 2;        // lane centerline y (connector route)
  const enx = seq => bx(seq);                        // connector entry x (target left edge)

  // ── Outer shell ──
  const outer = document.createElement('div');
  outer.className = 'swimlane-outer';

  const hdr = document.createElement('div');
  hdr.className = 'swimlane-header';
  hdr.innerHTML = `<span class="cycle-dot ${cc}"></span>${stageName} <span style="font-size:11px;font-weight:400;color:var(--ink-faint);margin-left:8px">column = sequence · row = person · connectors are orthogonal</span>`;
  outer.appendChild(hdr);

  // ── Scroll container (single overflow-x:auto so sticky labels work) ──
  const scrollWrap = document.createElement('div');
  scrollWrap.style.cssText = 'overflow-x:auto;';

  const flexRow = document.createElement('div');
  flexRow.style.cssText = 'display:flex;';

  // ── Label column (sticky left) ──
  const labelCol = document.createElement('div');
  labelCol.style.cssText = `
    flex-shrink:0; width:130px;
    border-right:1px solid var(--border);
    position:sticky; left:0; z-index:3; background:var(--white);
  `;
  roles.forEach((role, i) => {
    const cell = document.createElement('div');
    cell.style.cssText = `
      height:${ROW_H}px; display:flex; align-items:center; padding:0 14px;
      font-size:11px; font-weight:600; color:var(--ink-faint);
      text-transform:uppercase; letter-spacing:0.05em;
      background:#f8f8f8;
      border-bottom:${i < roles.length - 1 ? '1px solid var(--border)' : 'none'};
    `;
    cell.textContent = role;
    labelCol.appendChild(cell);
  });

  // ── Canvas ──
  const canvas = document.createElement('div');
  canvas.style.cssText = `position:relative; width:${canvasW}px; height:${canvasH}px; flex-shrink:0;`;

  // Lane stripes + row dividers
  roles.forEach((_, i) => {
    const lane = document.createElement('div');
    lane.style.cssText = `
      position:absolute; top:${i * ROW_H}px; left:0; width:${canvasW}px; height:${ROW_H}px;
      background:${i % 2 ? 'rgba(0,0,0,0.018)' : 'transparent'};
      border-bottom:${i < roles.length - 1 ? '1px solid #efefef' : 'none'};
    `;
    canvas.appendChild(lane);
  });

  // ── SVG — appended before boxes so boxes render on top ──
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;overflow:visible;';
  svg.setAttribute('width', canvasW);
  svg.setAttribute('height', canvasH);
  svg.innerHTML = `<defs>
    <marker id="ah-poc" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#aaa"/>
    </marker>
  </defs>`;
  canvas.appendChild(svg);

  // Draw right-angle connectors
  activities.forEach(act => {
    const srcIds = parseRefIds(act['Receives from']).filter(id => stageIds.has(id));
    if (!srcIds.length) return;

    const tgtRole = primaryRole(act, roles);
    const ri2 = rIdx[tgtRole];
    const x2 = enx(act.Sequence);
    const y2 = cy(ri2);

    srcIds.forEach(srcId => {
      const srcAct = actMap[srcId];
      if (!srcAct) return;
      const srcRole = primaryRole(srcAct, roles);
      const ri1 = rIdx[srcRole];
      const x1 = ex(srcAct.Sequence);
      const y1 = cy(ri1);

      let d;
      if (ri1 === ri2) {
        // Same row — straight horizontal
        d = `M ${x1} ${y1} H ${x2}`;
      } else {
        // Cross-row — right angle through midpoint column
        const midX = Math.round((x1 + x2) / 2);
        d = `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`;
      }

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', ri1 === ri2 ? '#d0d0d0' : '#aaa');
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-linecap', 'butt');
      path.setAttribute('stroke-linejoin', 'miter');
      path.setAttribute('marker-end', 'url(#ah-poc)');
      svg.appendChild(path);
    });
  });

  // ── Activity boxes — appended after SVG so they sit on top ──
  activities.forEach(act => {
    const role = primaryRole(act, roles);
    const ri = rIdx[role];

    const box = document.createElement('div');
    box.className = 'flow-box';
    box.dataset.actId = act.ID;
    box.style.cssText = `
      position:absolute; left:${bx(act.Sequence)}px; top:${by(ri)}px;
      width:${BOX_W}px; min-height:52px;
    `;
    box.innerHTML = `<div class="flow-id">${act.ID}</div><div class="flow-label">${act.Activity}</div>`;

    box.addEventListener('click', e => {
      e.stopPropagation();
      const panel = document.getElementById('flow-panel');
      const existing = panel.querySelector('.flow-detail-card');
      if (existing) {
        const isSame = existing.dataset.forId === act.ID;
        existing.remove();
        canvas.querySelectorAll('.flow-box').forEach(b => b.classList.remove('highlighted'));
        if (isSame) return;
      }
      const card = buildDetailCard(act);
      card.classList.add('flow-detail-card');
      card.dataset.forId = act.ID;
      card.style.marginTop = '12px';
      panel.appendChild(card);

      canvas.querySelectorAll('.flow-box').forEach(b => b.classList.remove('highlighted'));
      box.classList.add('highlighted');
      parseRefIds(act['Receives from'])
        .filter(id => stageIds.has(id))
        .forEach(refId => {
          const src = canvas.querySelector(`[data-act-id="${refId}"]`);
          if (src) src.classList.add('highlighted');
        });
    });

    canvas.appendChild(box);
  });

  flexRow.appendChild(labelCol);
  flexRow.appendChild(canvas);
  scrollWrap.appendChild(flexRow);
  outer.appendChild(scrollWrap);

  const hint = document.createElement('div');
  hint.className = 'swimlane-hint';
  hint.textContent = 'Connectors route at right angles: horizontal → vertical → horizontal. Same-row connections are straight lines. Click any activity for details.';
  outer.appendChild(hint);

  return outer;
}

// ── Flow: Intake fan-in layout ────────────────────────────────────────────
// Activities 1.1.1–1.1.11 are parallel starting points, one per person's row.
// Column position = local index within that person's row (not global sequence).
// Activities 1.1.12 and 1.1.13 (Claudia) are consolidation points at far right.
function renderFlowIntake(cycle, stageName, activities, stageIds) {
  const ROW_H = 150, COL_W = 220, BOX_W = 155, PAD_X = 20, LANE_PAD = 14;
  const cc = cycleClass(cycle);

  const rolesSet = new Set();
  activities.forEach(act => whoList(act).forEach(r => rolesSet.add(r)));
  const roles = CANONICAL_ORDER.filter(r => rolesSet.has(r));
  const rIdx = Object.fromEntries(roles.map((r, i) => [r, i]));

  // Split: fan-in origins (seq ≤ 11) vs consolidation (seq ≥ 12)
  const originActs = activities.filter(a => a.Sequence <= 11);
  const consolidateActs = activities.filter(a => a.Sequence >= 12).sort((a, b) => a.Sequence - b.Sequence);

  // Compute local column index per person's row for origin activities
  const localColPerRole = {};
  const actColIdx = {};
  originActs.forEach(act => {
    const role = primaryRole(act, roles);
    if (localColPerRole[role] === undefined) localColPerRole[role] = 0;
    actColIdx[act.ID] = localColPerRole[role]++;
  });

  // Find max local col used across all rows
  const maxLocalIdx = Math.max(...Object.values(localColPerRole).map(v => v - 1), 0);

  // Consolidation activities get columns after the fan-in section
  consolidateActs.forEach((act, i) => {
    actColIdx[act.ID] = maxLocalIdx + 1 + i;
  });

  const totalCols = maxLocalIdx + 1 + consolidateActs.length;
  const canvasW = PAD_X + totalCols * COL_W + PAD_X;
  const canvasH = roles.length * ROW_H;

  // Position helpers (ID-based, not sequence-based)
  const bx  = id  => PAD_X + actColIdx[id] * COL_W;
  const by  = ri  => ri * ROW_H + LANE_PAD;
  const ex  = id  => bx(id) + BOX_W;
  const cy  = ri  => ri * ROW_H + ROW_H / 2;
  const enx = id  => bx(id);

  const actMap = Object.fromEntries(activities.map(a => [a.ID, a]));

  // ── Outer shell ──
  const outer = document.createElement('div');
  outer.className = 'swimlane-outer';

  const hdr = document.createElement('div');
  hdr.className = 'swimlane-header';
  hdr.innerHTML = `<span class="cycle-dot ${cc}"></span>${stageName} <span style="font-size:11px;font-weight:400;color:var(--ink-faint);margin-left:8px">parallel inputs per person · consolidation at right · connectors are orthogonal</span>`;
  outer.appendChild(hdr);

  const scrollWrap = document.createElement('div');
  scrollWrap.style.cssText = 'overflow-x:auto;';

  const flexRow = document.createElement('div');
  flexRow.style.cssText = 'display:flex;';

  // ── Label column (sticky left) ──
  const labelCol = document.createElement('div');
  labelCol.style.cssText = `
    flex-shrink:0; width:130px;
    border-right:1px solid var(--border);
    position:sticky; left:0; z-index:3; background:var(--white);
  `;
  roles.forEach((role, i) => {
    const cell = document.createElement('div');
    cell.style.cssText = `
      height:${ROW_H}px; display:flex; align-items:center; padding:0 14px;
      font-size:11px; font-weight:600; color:var(--ink-faint);
      text-transform:uppercase; letter-spacing:0.05em;
      background:#f8f8f8;
      border-bottom:${i < roles.length - 1 ? '1px solid var(--border)' : 'none'};
    `;
    cell.textContent = role;
    labelCol.appendChild(cell);
  });

  // ── Canvas ──
  const canvas = document.createElement('div');
  canvas.style.cssText = `position:relative; width:${canvasW}px; height:${canvasH}px; flex-shrink:0;`;

  // Lane stripes
  roles.forEach((_, i) => {
    const lane = document.createElement('div');
    lane.style.cssText = `
      position:absolute; top:${i * ROW_H}px; left:0; width:${canvasW}px; height:${ROW_H}px;
      background:${i % 2 ? 'rgba(0,0,0,0.018)' : 'transparent'};
      border-bottom:${i < roles.length - 1 ? '1px solid #efefef' : 'none'};
    `;
    canvas.appendChild(lane);
  });

  // ── SVG — appended before boxes ──
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;overflow:visible;';
  svg.setAttribute('width', canvasW);
  svg.setAttribute('height', canvasH);
  svg.innerHTML = `<defs>
    <marker id="ah-intake" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#aaa"/>
    </marker>
  </defs>`;
  canvas.appendChild(svg);

  // Draw right-angle connectors
  activities.forEach(act => {
    const srcIds = parseRefIds(act['Receives from']).filter(id => stageIds.has(id));
    if (!srcIds.length) return;

    const tgtRole = primaryRole(act, roles);
    const ri2 = rIdx[tgtRole];
    const x2 = enx(act.ID);
    const y2 = cy(ri2);

    srcIds.forEach(srcId => {
      const srcAct = actMap[srcId];
      if (!srcAct) return;
      const srcRole = primaryRole(srcAct, roles);
      const ri1 = rIdx[srcRole];
      const x1 = ex(srcId);
      const y1 = cy(ri1);

      let d;
      if (ri1 === ri2) {
        d = `M ${x1} ${y1} H ${x2}`;
      } else {
        const midX = Math.round((x1 + x2) / 2);
        d = `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`;
      }

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', ri1 === ri2 ? '#d0d0d0' : '#aaa');
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-linecap', 'butt');
      path.setAttribute('stroke-linejoin', 'miter');
      path.setAttribute('marker-end', 'url(#ah-intake)');
      svg.appendChild(path);
    });
  });

  // ── Activity boxes — appended after SVG ──
  activities.forEach(act => {
    const role = primaryRole(act, roles);
    const ri = rIdx[role];

    const box = document.createElement('div');
    box.className = 'flow-box';
    box.dataset.actId = act.ID;
    box.style.cssText = `
      position:absolute; left:${bx(act.ID)}px; top:${by(ri)}px;
      width:${BOX_W}px; min-height:52px;
    `;
    box.innerHTML = `<div class="flow-id">${act.ID}</div><div class="flow-label">${act.Activity}</div>`;

    box.addEventListener('click', e => {
      e.stopPropagation();
      const panel = document.getElementById('flow-panel');
      const existing = panel.querySelector('.flow-detail-card');
      if (existing) {
        const isSame = existing.dataset.forId === act.ID;
        existing.remove();
        canvas.querySelectorAll('.flow-box').forEach(b => b.classList.remove('highlighted'));
        if (isSame) return;
      }
      const card = buildDetailCard(act);
      card.classList.add('flow-detail-card');
      card.dataset.forId = act.ID;
      card.style.marginTop = '12px';
      panel.appendChild(card);

      canvas.querySelectorAll('.flow-box').forEach(b => b.classList.remove('highlighted'));
      box.classList.add('highlighted');
      parseRefIds(act['Receives from'])
        .filter(id => stageIds.has(id))
        .forEach(refId => {
          const src = canvas.querySelector(`[data-act-id="${refId}"]`);
          if (src) src.classList.add('highlighted');
        });
    });

    canvas.appendChild(box);
  });

  flexRow.appendChild(labelCol);
  flexRow.appendChild(canvas);
  scrollWrap.appendChild(flexRow);
  outer.appendChild(scrollWrap);

  const hint = document.createElement('div');
  hint.className = 'swimlane-hint';
  hint.textContent = 'Intake: parallel inputs per person converge into consolidation activities at right. Connectors route at right angles. Click any activity for details.';
  outer.appendChild(hint);

  return outer;
}

// ── Portfolio ─────────────────────────────────────────────────────────────
let PORTFOLIO = null;
let activeProjectName = null;

fetch('portfolio.json')
  .then(r => r.json())
  .then(data => {
    PORTFOLIO = data;
    buildPortfolio();
  });

function fmt$(n) {
  if (n == null) return '—';
  return '$' + Number(n).toLocaleString();
}
function fmtPct(n) {
  if (n == null) return '—';
  return Math.round(n * 100) + '%';
}
function fmtRate(n) {
  if (n == null) return '—';
  return (n * 100).toFixed(2) + '%';
}

function statusClass(status) {
  if (!status) return '';
  const s = status.toLowerCase();
  if (s.includes('under')) return 'status-under';
  if (s.includes('pre')) return 'status-pre';
  return 'status-entitle';
}

function confClass(term) {
  const map = {
    'Confirmed': 'conf-confirmed',
    'Pending Confirmation': 'conf-pending',
    'Flagged': 'conf-flagged',
    'Missing': 'conf-missing',
    'Estimate': 'conf-estimate',
    'Budget': 'conf-budget',
  };
  return map[term] || 'conf-missing';
}

function buildPortfolio() {
  const container = document.getElementById('portfolio-content');
  container.innerHTML = '';

  const projects = PORTFOLIO['Projects'];

  // Header row
  const hdr = document.createElement('div');
  hdr.className = 'project-row project-row-hdr';
  ['Project', 'Location', 'Type', 'Units', 'Status', 'Estimate'].forEach(label => {
    const d = document.createElement('div');
    d.textContent = label;
    hdr.appendChild(d);
  });

  const list = document.createElement('div');
  list.className = 'portfolio-list';
  list.appendChild(hdr);

  projects.forEach(proj => {
    const row = document.createElement('div');
    row.className = 'project-row';
    row.dataset.project = proj.Project;

    const name = document.createElement('div');
    name.className = 'project-name';
    name.textContent = proj.Project;

    const loc = document.createElement('div');
    loc.textContent = proj.Location;

    const type = document.createElement('div');
    type.textContent = proj.Type;

    const units = document.createElement('div');
    units.textContent = proj.Units;

    const status = document.createElement('div');
    const badge = document.createElement('span');
    badge.className = 'project-status ' + statusClass(proj.Status);
    badge.textContent = proj.Status;
    status.appendChild(badge);

    const est = document.createElement('div');
    est.className = 'project-estimate';
    est.textContent = fmt$(proj.Estimate);

    row.appendChild(name);
    row.appendChild(loc);
    row.appendChild(type);
    row.appendChild(units);
    row.appendChild(status);
    row.appendChild(est);

    row.addEventListener('click', () => {
      const isSame = activeProjectName === proj.Project;
      // Clear existing detail
      const existing = container.querySelector('.portfolio-detail');
      if (existing) existing.remove();
      container.querySelectorAll('.project-row').forEach(r => r.classList.remove('active'));

      if (isSame) {
        activeProjectName = null;
        return;
      }
      activeProjectName = proj.Project;
      row.classList.add('active');
      container.appendChild(buildProjectDetail(proj));
    });

    list.appendChild(row);
  });

  container.appendChild(list);

  // ── Debt by lender summary (collapsible) ──
  container.appendChild(buildCollapsible('Debt by lender', buildDebtSummary));

  // ── Equity by investor summary (collapsible) ──
  container.appendChild(buildCollapsible('Equity by investor', buildInvestorSummary));
}


function buildCollapsible(title, contentBuilder) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:24px;';

  const toggle = document.createElement('button');
  toggle.style.cssText = `
    display:flex; align-items:center; gap:8px;
    background:none; border:none; cursor:pointer; padding:0;
    font-size:11px; font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-faint);
  `;

  const arrow = document.createElement('span');
  arrow.style.cssText = 'font-size:10px; transition:transform 0.15s; display:inline-block;';
  arrow.textContent = '▶';

  const titleSpan = document.createElement('span');
  titleSpan.textContent = title;

  toggle.appendChild(arrow);
  toggle.appendChild(titleSpan);
  wrap.appendChild(toggle);

  const body = document.createElement('div');
  body.appendChild(contentBuilder());
  wrap.appendChild(body);
  arrow.style.transform = 'rotate(90deg)';

  toggle.addEventListener('click', () => {
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : '';
    arrow.style.transform = open ? '' : 'rotate(90deg)';
  });

  return wrap;
}

function buildGroupedCards(groups) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:12px;';

  groups.forEach(group => {
    const groupWrap = document.createElement('div');
    groupWrap.style.cssText = 'margin-top:20px;';

    const groupLabel = document.createElement('div');
    groupLabel.style.cssText = 'font-size:13px; font-weight:600; color:var(--ink); margin-bottom:12px;';
    groupLabel.textContent = group.groupName;
    groupWrap.appendChild(groupLabel);

    const cardRow = document.createElement('div');
    cardRow.className = 'profile-grid';

    group.cards.forEach(cardData => {
      const card = document.createElement('div');
      card.className = 'profile-card';

      const cardHeader = document.createElement('div');
      cardHeader.className = 'profile-card-name';
      cardHeader.textContent = cardData.header;
      card.appendChild(cardHeader);

      cardData.fields.forEach(({label, value}) => {
        const field = document.createElement('div');
        field.className = 'profile-field';
        field.innerHTML = `<span class="profile-field-label">${label}</span><span class="profile-field-value">${value}</span>`;
        card.appendChild(field);
      });

      cardRow.appendChild(card);
    });

    groupWrap.appendChild(cardRow);
    wrap.appendChild(groupWrap);
  });

  return wrap;
}

function buildSummaryTable(headers, groupedRows) {
  const tableWrap = document.createElement('div');
  tableWrap.style.cssText = 'margin-top:12px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--white);';

  const table = document.createElement('table');
  table.className = 'sov-table';
  table.style.width = '100%';

  const thead = document.createElement('thead');
  thead.innerHTML = '<tr>' + headers.map((h, i) =>
    `<th class="${i >= 2 ? 'num' : ''}">${h}</th>`
  ).join('') + '</tr>';
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  groupedRows.forEach(({ groupName, rows }) => {
    rows.forEach((cells, i) => {
      const tr = document.createElement('tr');
      // first cell: group name only on first row
      const tdGroup = document.createElement('td');
      tdGroup.style.cssText = 'font-weight:600; color:var(--ink); white-space:nowrap;';
      tdGroup.textContent = i === 0 ? groupName : '';
      tr.appendChild(tdGroup);
      cells.forEach((val, ci) => {
        const td = document.createElement('td');
        td.className = ci >= 1 ? 'num' : '';
        td.textContent = val;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });

  table.appendChild(tbody);
  tableWrap.appendChild(table);
  return tableWrap;
}

function buildFlatTable(headers, groupedRows, numericFromCol) {
  // numericFromCol: column index (0-based) from which values are numeric (right-align)
  const colCount = headers.length;
  const colTemplate = headers.map((_, i) => i >= numericFromCol ? '1fr' : (i === 0 ? '160px' : '1fr')).join(' ');

  const wrap = document.createElement('div');
  wrap.className = 'summary-grid';
  wrap.style.gridTemplateColumns = colTemplate;

  // Header row
  const hdr = document.createElement('div');
  hdr.className = 'summary-grid-row summary-grid-hdr';
  hdr.style.gridTemplateColumns = colTemplate;
  headers.forEach((h, i) => {
    const cell = document.createElement('div');
    if (i >= numericFromCol) cell.className = 'sg-num';
    cell.textContent = h;
    hdr.appendChild(cell);
  });
  wrap.appendChild(hdr);

  groupedRows.forEach(({ groupName, rows }) => {
    rows.forEach((cells, ri) => {
      const row = document.createElement('div');
      row.className = 'summary-grid-row';
      row.style.gridTemplateColumns = colTemplate;

      // Group name cell
      const gcell = document.createElement('div');
      if (ri === 0) gcell.className = 'sg-group';
      gcell.textContent = ri === 0 ? groupName : '';
      row.appendChild(gcell);

      cells.forEach((val, ci) => {
        const cell = document.createElement('div');
        if (ci + 1 >= numericFromCol) cell.className = 'sg-num';
        cell.textContent = val;
        row.appendChild(cell);
      });

      wrap.appendChild(row);
    });
  });

  return wrap;
}

function buildDebtSummary() {
  const byLender = {};
  PORTFOLIO['Debt Profile'].forEach(r => {
    if (!byLender[r.Lender]) byLender[r.Lender] = [];
    byLender[r.Lender].push(r);
  });

  const headers = ['Lender', 'Project', 'Loan amount', 'Drawn to date', 'Available to draw', 'Interest rate'];
  const groupedRows = Object.entries(byLender).map(([lender, rows]) => ({
    groupName: lender,
    rows: rows.map(r => [
      r.Project,
      fmt$(r['Loan Amount']),
      fmt$(r['Drawn to Date']),
      fmt$(r['Available to Draw']),
      fmtRate(r['Interest Rate']),
    ]),
  }));

  return buildFlatTable(headers, groupedRows, 2);
}

function buildInvestorSummary() {
  const byInvestor = {};
  PORTFOLIO['Investor Profile'].forEach(r => {
    if (!byInvestor[r.Investor]) byInvestor[r.Investor] = [];
    byInvestor[r.Investor].push(r);
  });

  const headers = ['Investor', 'Project', 'Amount committed', 'Amount invested', 'Profit share', 'Capital returned'];
  const groupedRows = Object.entries(byInvestor).map(([investor, rows]) => ({
    groupName: investor,
    rows: rows.map(r => [
      r.Project,
      fmt$(r['Amount Committed']),
      fmt$(r['Amount Invested']),
      fmtPct(r['Profit Share']),
      fmt$(r['Capital Returned to Date']),
    ]),
  }));

  return buildFlatTable(headers, groupedRows, 2);
}

function buildDetailCollapsible(title, contentEl, startOpen = false) {
  const section = document.createElement('div');
  section.className = 'portfolio-section';

  const toggle = document.createElement('button');
  toggle.style.cssText = `
    display:flex; align-items:center; gap:8px;
    background:none; border:none; cursor:pointer; padding:0;
    font-size:11px; font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:0;
  `;

  const arrow = document.createElement('span');
  arrow.style.cssText = 'font-size:9px; transition:transform 0.15s; display:inline-block; color:var(--ink-faint);';
  arrow.textContent = '▶';

  const titleSpan = document.createElement('span');
  titleSpan.textContent = title;

  toggle.appendChild(arrow);
  toggle.appendChild(titleSpan);
  section.appendChild(toggle);

  contentEl.style.display = startOpen ? '' : 'none';
  contentEl.style.marginTop = '14px';
  if (startOpen) arrow.style.transform = 'rotate(90deg)';
  section.appendChild(contentEl);

  toggle.addEventListener('click', () => {
    const open = contentEl.style.display !== 'none';
    contentEl.style.display = open ? 'none' : '';
    arrow.style.transform = open ? '' : 'rotate(90deg)';
  });

  return section;
}

function buildProjectDetail(proj) {
  const pName = proj.Project;
  const sovLines = PORTFOLIO['SOV Lines'].filter(r => r.Project === pName);
  const debt = PORTFOLIO['Debt Profile'].find(r => r.Project === pName);
  const investors = PORTFOLIO['Investor Profile'].filter(r => r.Project === pName);
  const confDefs = Object.fromEntries(PORTFOLIO['Confidence Definitions'].map(r => [r.Term, r]));

  const detail = document.createElement('div');
  detail.className = 'portfolio-detail';

  // Header
  const phdr = document.createElement('div');
  phdr.className = 'portfolio-detail-header';
  phdr.innerHTML = `
    <h2>${pName}</h2>
    <span class="phdr-meta">${proj.Location} · ${proj.Type} · ${proj.Units} units</span>
    <span class="project-status ${statusClass(proj.Status)}" style="margin-left:4px">${proj.Status}</span>
  `;
  detail.appendChild(phdr);

  const body = document.createElement('div');

  // Active popover tracker
  let activePopover = null;
  let activePopoverTerm = null;

  // ── SOV Section ──
  const sovSection = document.createElement('div');

  const table = document.createElement('table');
  table.className = 'sov-table';

  const hasActuals = sovLines.some(r => r['Actual to Date'] != null);
  const hasBudget  = sovLines.some(r => r['Budget'] != null);

  let headerCols = ['Category'];
  if (hasBudget) headerCols.push('Estimate', 'Budget');
  else headerCols.push('Estimate');
  if (hasActuals) headerCols.push('Actual to date', '% complete');
  headerCols.push('Confidence');

  const thead = document.createElement('thead');
  thead.innerHTML = '<tr>' + headerCols.map((h, i) =>
    `<th class="${i > 0 ? 'num' : ''}">${h}</th>`
  ).join('') + '</tr>';
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  let totalEst = 0, totalBudget = 0, totalActual = 0;

  sovLines.forEach(line => {
    totalEst    += line['Estimate'] || 0;
    totalBudget += line['Budget']   || 0;
    totalActual += line['Actual to Date'] || 0;

    const tr = document.createElement('tr');

    const tdCat = document.createElement('td');
    tdCat.textContent = line.Category;
    tr.appendChild(tdCat);

    const tdEst = document.createElement('td');
    tdEst.className = 'num';
    tdEst.textContent = fmt$(line['Estimate']);
    tr.appendChild(tdEst);

    if (hasBudget) {
      const tdBud = document.createElement('td');
      tdBud.className = 'num';
      tdBud.textContent = fmt$(line['Budget']);
      tr.appendChild(tdBud);
    }

    if (hasActuals) {
      const tdAct = document.createElement('td');
      tdAct.className = 'num';
      tdAct.textContent = fmt$(line['Actual to Date']);
      tr.appendChild(tdAct);

      const tdPct = document.createElement('td');
      tdPct.className = 'num';
      tdPct.textContent = fmtPct(line['Percent Complete']);
      tr.appendChild(tdPct);
    }

    // Confidence tag — clickable
    const tdConf = document.createElement('td');
    const tag = document.createElement('span');
    tag.className = 'confidence-tag ' + confClass(line.Confidence);
    tag.textContent = line.Confidence;

    const defRow = confDefs[line.Confidence];
    if (defRow) {
      tag.addEventListener('click', e => {
        e.stopPropagation();
        // toggle
        if (activePopover && activePopoverTerm === line.Confidence) {
          activePopover.remove();
          activePopover = null;
          activePopoverTerm = null;
          return;
        }
        if (activePopover) activePopover.remove();

        const pop = document.createElement('div');
        pop.className = 'confidence-popover';
        pop.innerHTML = `
          <strong>${defRow.Term}</strong>
          <div>${defRow.Meaning}</div>
          <div class="conf-when">${defRow['When It Applies']}</div>
        `;
        activePopover = pop;
        activePopoverTerm = line.Confidence;
        tdConf.appendChild(pop);
      });
    }

    tdConf.appendChild(tag);
    tr.appendChild(tdConf);
    tbody.appendChild(tr);
  });

  // Totals row
  const tfoot = document.createElement('tfoot');
  const trTot = document.createElement('tr');
  trTot.className = 'sov-total';

  const tdTotLabel = document.createElement('td');
  tdTotLabel.textContent = 'Total';
  trTot.appendChild(tdTotLabel);

  const tdTotEst = document.createElement('td');
  tdTotEst.className = 'num';
  tdTotEst.textContent = fmt$(totalEst);
  trTot.appendChild(tdTotEst);

  if (hasBudget) {
    const tdTotBud = document.createElement('td');
    tdTotBud.className = 'num';
    tdTotBud.textContent = fmt$(totalBudget);
    trTot.appendChild(tdTotBud);
  }

  if (hasActuals) {
    const tdTotAct = document.createElement('td');
    tdTotAct.className = 'num';
    tdTotAct.textContent = fmt$(totalActual);
    trTot.appendChild(tdTotAct);

    const tdTotPct = document.createElement('td');
    tdTotPct.className = 'num';
    const overall = totalBudget > 0 ? totalActual / totalBudget : null;
    tdTotPct.textContent = fmtPct(overall);
    trTot.appendChild(tdTotPct);
  }

  const tdTotConf = document.createElement('td');
  trTot.appendChild(tdTotConf);

  tfoot.appendChild(trTot);
  table.appendChild(tbody);
  table.appendChild(tfoot);
  sovSection.appendChild(table);
  body.appendChild(buildDetailCollapsible('Schedule of values', sovSection, true));

  // ── Debt Profile Section ──
  if (debt) {
    const grid = document.createElement('div');
    grid.className = 'profile-grid';

    const card = document.createElement('div');
    card.className = 'profile-card';
    card.innerHTML = `<div class="profile-card-name">${debt.Lender}</div>`;

    [
      ['Loan amount',       fmt$(debt['Loan Amount'])],
      ['Drawn to date',     fmt$(debt['Drawn to Date'])],
      ['Available to draw', fmt$(debt['Available to Draw'])],
      ['Interest rate',     fmtRate(debt['Interest Rate'])],
    ].forEach(([label, val]) => {
      const f = document.createElement('div');
      f.className = 'profile-field';
      f.innerHTML = `<span class="profile-field-label">${label}</span><span class="profile-field-value">${val}</span>`;
      card.appendChild(f);
    });

    grid.appendChild(card);
    body.appendChild(buildDetailCollapsible('Debt profile', grid, false));
  }

  // ── Investor Profile Section ──
  if (investors.length) {
    const grid = document.createElement('div');
    grid.className = 'profile-grid';

    investors.forEach(inv => {
      const card = document.createElement('div');
      card.className = 'profile-card';
      card.innerHTML = `<div class="profile-card-name">${inv.Investor}</div>`;

      [
        ['Amount committed', fmt$(inv['Amount Committed'])],
        ['Amount invested',  fmt$(inv['Amount Invested'])],
        ['Profit share',     fmtPct(inv['Profit Share'])],
        ['Capital returned', fmt$(inv['Capital Returned to Date'])],
        ['Projected return', inv['Projected Return'] || '—'],
      ].forEach(([label, val]) => {
        const f = document.createElement('div');
        f.className = 'profile-field';
        f.innerHTML = `<span class="profile-field-label">${label}</span><span class="profile-field-value">${val}</span>`;
        card.appendChild(f);
      });

      grid.appendChild(card);
    });

    body.appendChild(buildDetailCollapsible('Investor profile', grid, false));
  }

  detail.appendChild(body);

  // Close popover on outside click
  detail.addEventListener('click', () => {
    if (activePopover) {
      activePopover.remove();
      activePopover = null;
      activePopoverTerm = null;
    }
  });

  return detail;
}

// Close flow detail card when clicking outside
document.addEventListener('click', e => {
  if (!e.target.closest('.flow-box') && !e.target.closest('.flow-detail-card')) {
    document.querySelector('.flow-detail-card')?.remove();
    document.querySelectorAll('.flow-box').forEach(b => b.classList.remove('highlighted'));
  }
});
